[tool.poetry]
name = "torrent-stats"
version = "1.0.0"
description = "Resolving info hashes into .torrent files, detailed file trees, and live peer/seed stats across trackers."
authors = ["Douglas Paz <eu@douglaspaz.com>"]
readme = "README.md"
packages = [{include = "torrent_stats"}]

[tool.poetry.dependencies]
python = ">=3.15"
fastapi = "^0.162.2"
uvicorn = "^0.54.0"
pydantic = "^2.14.3"
pydantic-settings = "^2.16.2"
redis = "^8.1.0"
httpx = "^0.28.1"
fsspec = "^2026.9.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["torrent_stats"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
files = ["torrent_stats"]

[dependency-groups]
dev = [
    "ruff (>=0.17.4,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]
