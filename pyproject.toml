[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torrent-stats"
version = "1.0.0"
description = "Resolving info hashes into .torrent files, detailed file trees, and live peer/seed stats across trackers."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "redis>=4.5.0",
    "httpx>=0.24.0",
    "fsspec>=2023.6.0",
]
authors = [
    { name = "Douglas Paz", email = "eu@douglaspaz.com" }
]

[tool.setuptools]
packages = ["torrent_stats"]
