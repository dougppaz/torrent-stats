[tool.poetry]
name = "torrent-stats"
version = "1.0.0"
description = "Resolving info hashes into .torrent files, detailed file trees, and live peer/seed stats across trackers."
authors = ["Douglas Paz <eu@douglaspaz.com>"]
readme = "README.md"
packages = [{include = "torrent_stats"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.124.4"
uvicorn = ">=0.33.0"
pydantic = ">=2.10"
pydantic-settings = ">=2.8"
redis = ">=6.1.1"
httpx = ">=0.28.1"
fsspec = ">=2025.3.0"
couchdb = "^1.2"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.3.0"
mypy = ">=1.8.0"
pre-commit = ">=3.5.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.masonry.api"

[tool.ruff]
line-length = 88
src = ["torrent_stats"]

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
files = ["torrent_stats"]
