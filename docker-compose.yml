services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - COUCHDB_URL=http://admin:admin@couchdb:5984
      - COUCHDB_DB_NAME=torrent_stats
      - REDIS_URL=redis://redis:6379/0
      - WORKER_ALLOW_ANY_KEY=true
    depends_on:
      - couchdb
      - redis

  couchdb:
    image: couchdb:3.5
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=admin
    volumes:
      - couchdb_data:/opt/couchdb/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  couchdb_data:
