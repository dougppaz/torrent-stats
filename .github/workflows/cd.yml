name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Worker Binaries
        run: |
          mkdir -p worker/dist
          cd worker
          
          # Linux amd64 (targeting v1 for maximum CPU compatibility on older servers)
          GOOS=linux GOARCH=amd64 GOAMD64=v1 go build -ldflags="-s -w" -o dist/torrent-stats-worker-linux-amd64 .
          
          # Linux amd64 (targeting v2 for optimized instruction set on modern x86_64 CPUs)
          GOOS=linux GOARCH=amd64 GOAMD64=v2 go build -ldflags="-s -w" -o dist/torrent-stats-worker-linux-amd64-v2 .
          
          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/torrent-stats-worker-linux-arm64 .
          
          # Darwin (macOS) amd64
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/torrent-stats-worker-darwin-amd64 .
          
          # Darwin (macOS) arm64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/torrent-stats-worker-darwin-arm64 .
          
          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/torrent-stats-worker-windows-amd64.exe .

      - name: Create a GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: Release ${{ github.ref_name }}
          generateReleaseNotes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          makeLatest: ${{ !contains(github.ref_name, '-rc') }}
          artifacts: "worker/dist/torrent-stats-worker-*"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc') }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
