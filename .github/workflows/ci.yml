name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Install Dependencies
        run: poetry install

      - name: Run Ruff Linter
        run: poetry run ruff check torrent_stats/ tests/

      - name: Run Ruff Formatter
        run: poetry run ruff format --check torrent_stats/ tests/

      - name: Run Mypy Type Check
        run: poetry run mypy torrent_stats/

      - name: Run Pytest
        run: poetry run pytest

  go-worker-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./worker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go Test & Build
        run: |
          go test ./...
          go build -o torrent-stats-worker .
