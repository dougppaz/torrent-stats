openapi: 3.0.3
info:
  title: Torrent Stats API
  version: 1.0.0
  description: API for resolving info hashes into .torrent files, detailed file trees, live tracker stats, and managing remote worker tasks.
paths:
  /torrents/{hash}:
    get:
      summary: Get torrent metadata, file tree, tracker stats, download URL, and task statuses
      description: Returns 200 OK with available data (nullable if uninitialized), increments Redis hit count (12h hourly bucket synced to CouchDB), auto-enqueues scrape if unknown, and registers custom trackers if passed via query string.
      parameters:
        - name: hash
          in: path
          required: true
          description: Torrent Info Hash (hex or b32)
          schema:
            type: string
        - name: trackers
          in: query
          required: false
          description: Optional custom tracker URL(s) to register and monitor
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Torrent details, download URL, and task statuses retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  info_hash:
                    type: string
                  name:
                    type: string
                    nullable: true
                  total_size:
                    type: integer
                    nullable: true
                  torrent_storage_ref:
                    type: string
                    nullable: true
                  storage_profile_key:
                    type: string
                    nullable: true
                  file_path:
                    type: string
                    nullable: true
                  download_url:
                    type: string
                    nullable: true
                    description: Public download URL for the .torrent file generated via storage profile template
                  total_hits:
                    type: integer
                  last_hit_at:
                    type: string
                    format: date-time
                    nullable: true
                  files:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        path:
                          type: array
                          items:
                            type: string
                        length:
                          type: integer
                  tracker_stats:
                    type: array
                    items:
                      type: object
                      properties:
                        tracker_url:
                          type: string
                        seeds:
                          type: integer
                        peers:
                          type: integer
                        updated_at:
                          type: string
                          format: date-time
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        task_id:
                          type: string
                        status:
                          type: string
                          enum: [pending, claimed, scraping, completed, failed]
                        created_at:
                          type: string
                          format: date-time
        '422':
          description: Invalid info hash format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /worker/tasks/claim:
    post:
      summary: Claim a prioritized scrape task for remote workers
      description: Authenticates via X-Worker-Key header, applies failure cooldowns (12h) for new torrents and update cooldowns (6h) for tracker stats, setting a lease ACK expiration.
      parameters:
        - name: X-Worker-Key
          in: header
          required: true
          description: Worker API Key stored in CouchDB
          schema:
            type: string
      responses:
        '200':
          description: Task successfully claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                  info_hash:
                    type: string
                  task_type:
                    type: string
                    enum: [scrape_torrent, scrape_stats]
                  lease_expires_at:
                    type: string
                    format: date-time
        '204':
          description: No pending tasks available
        '401':
          description: Unauthorized - missing or invalid X-Worker-Key

  /worker/torrents:
    post:
      summary: Upload raw .torrent file and metadata (handled by API agnostic storage)
      description: Called by remote workers upon successfully resolving and downloading a .torrent file. API uploads to storage profile and records profile key & file path.
      parameters:
        - name: X-Worker-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - info_hash
                - name
                - total_size
                - torrent_file
              properties:
                info_hash:
                  type: string
                name:
                  type: string
                total_size:
                  type: integer
                torrent_file:
                  type: string
                  format: binary
                  description: Raw .torrent file binary
                files:
                  type: string
                  description: JSON stringified file tree
      responses:
        '201':
          description: Torrent file successfully stored via active profile and metadata saved
        '400':
          description: Bad request / missing required fields
        '401':
          description: Unauthorized

  /worker/torrents/{hash}/stats:
    post:
      summary: Submit tracker peer/seed counts and scrape results
      description: Reports tracker stats and scrape success/failure. Automatically prunes trackers after 3 consecutive failures.
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
        - name: X-Worker-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tracker_url
                - success
              properties:
                tracker_url:
                  type: string
                success:
                  type: boolean
                seeds:
                  type: integer
                peers:
                  type: integer
      responses:
        '200':
          description: Tracker stats updated successfully
        '400':
          description: Bad request
        '401':
          description: Unauthorized

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
